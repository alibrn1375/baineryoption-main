version: '3.8'

services:
  # 1. PostgreSQL Database Service
  database:
    image: postgres:15-alpine
    container_name: fox_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-fox_trading}
      POSTGRES_USER: ${DB_USER:-fox_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fox_secure_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-fox_admin} -d ${DB_NAME:-fox_trading}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. FO-X 5M Core Backend & Real-Time Engine
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fox_backend
    restart: always
    depends_on:
      database:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
      - DB_HOST=database
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./configs:/app/configs
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # 3. Web Dashboard / Quant Visual Terminal
  dashboard:
    image: node:20-alpine
    container_name: fox_dashboard
    restart: always
    working_dir: /app
    volumes:
      - ./:/app
    command: sh -c "npm install && npm run build && npm run preview -- --host 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
